services:
  backend:
    build:
      context: ./APIWeb-main
    image: distrib/backend
    ports:
      - "3000:3000"
    volumes:
      - ./APIWeb-main:/app
      - /app/node_modules
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=mydb
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=24h
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INDEX_KEY=${INDEX_KEY}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
      - MP_WEBHOOK_URL=${MP_WEBHOOK_URL}
      - MP_BACK_URL_SUCCESS=${MP_BACK_URL_SUCCESS}
      - MP_BACK_URL_FAILURE=${MP_BACK_URL_FAILURE}
      - MP_BACK_URL_PENDING=${MP_BACK_URL_PENDING}
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=mydb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  frontend:
    build:
      context: ./WebProject-main/ProyectoWeb
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./WebProject-main/ProyectoWeb:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
