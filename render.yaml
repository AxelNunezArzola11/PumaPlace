# Puma Place — Render Blueprint (public sandbox testing).
# Apply from the repo root: Render Dashboard → New → Blueprint → this repo.
# Local development is unchanged: keep using compose.yml (MySQL 8).
#
# Deploy order (two-step URL wiring):
#   1. Create the TiDB Cloud Starter cluster + user first (see docs/DEPLOY-RENDER.md).
#   2. Apply this Blueprint; fill every `sync: false` value in the dashboard.
#   3. After the first deploy, copy the real service URLs back into API_URL
#      (frontend) and FRONTEND_URL / MP_* (backend) and redeploy.

services:
  # ---- Node.js / Express / Sequelize API (Docker) ----
  - type: web
    name: puma-place-api
    runtime: docker
    dockerfilePath: ./APIWeb-main/Dockerfile
    dockerContext: ./APIWeb-main
    plan: free
    healthCheckPath: /health
    # Runs inside the built image before traffic switches: creates missing
    # TiDB tables (never alters/drops), the pagos UNIQUE backstop and the
    # default categories.
    preDeployCommand: node src/scripts/dbMigrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false # TiDB host, e.g. <cluster>.tidbcloud.com
      - key: DB_PORT
        value: 4000
      - key: DB_USER
        sync: false # TiDB user, e.g. <prefix>.root (verbatim, prefix included)
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: pumaplace
      - key: DB_SSL
        value: true # mandatory: TiDB Cloud requires TLS
      # - key: DB_SSL_CA
      #   sync: false # optional: inline PEM or container path (defaults to system CAs)
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ENCRYPTION_KEY
        sync: false # 32 random bytes, base64
      - key: INDEX_KEY
        sync: false # 32 random bytes, base64
      - key: FRONTEND_URL
        sync: false # e.g. https://puma-place-web.onrender.com (exact, no trailing slash)
      - key: MP_ACCESS_TOKEN
        sync: false # Mercado Pago SANDBOX (TEST-...) token, never a live token
      - key: MP_WEBHOOK_URL
        sync: false # e.g. https://puma-place-api.onrender.com/api/pagos/webhook
      - key: MP_WEBHOOK_SECRET
        sync: false # webhook signing secret (x-signature); without it the webhook answers 503
      - key: MP_BACK_URL_SUCCESS
        sync: false # e.g. https://puma-place-web.onrender.com/pago/retorno/exito
      - key: MP_BACK_URL_FAILURE
        sync: false # e.g. https://puma-place-web.onrender.com/pago/retorno/fallo
      - key: MP_BACK_URL_PENDING
        sync: false # e.g. https://puma-place-web.onrender.com/pago/retorno/pendiente

  # ---- Angular 19 frontend (Static Site) ----
  - type: web
    name: puma-place-web
    runtime: static
    rootDir: WebProject-main/ProyectoWeb
    buildCommand: npm ci && node scripts/generate-environment.mjs && npm run build -- --configuration production
    staticPublishPath: dist/proyecto-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        sync: false # e.g. https://puma-place-api.onrender.com/api (backend URL + /api)
