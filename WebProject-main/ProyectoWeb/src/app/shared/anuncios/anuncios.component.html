<section *ngIf="cargando" class="anuncios-cargando" aria-label="Cargando publicidad">
  <p>Cargando anuncios…</p>
</section>

<p *ngIf="!cargando && error" class="anuncios-error" role="status">
  No se pudieron cargar los anuncios en este momento.
</p>

<aside *ngIf="!cargando && !error && anuncios.length" class="anuncios" aria-label="Publicidad">
  <h2 class="titulo">Publicidad</h2>
  <ol class="lista">
    <li *ngFor="let anuncio of anuncios" class="anuncio">
      <a [href]="anuncio.targetUrl" target="_blank" [attr.rel]="esExterno(anuncio) ? 'noopener noreferrer' : 'noopener'" class="enlace" [attr.aria-label]="anuncio.title">
        <img
          [src]="anuncio.imageUrl"
          [alt]="anuncio.title"
          loading="lazy"
          (error)="onImageError($event)">
        <span class="etiqueta">Anuncio</span>
        <span *ngIf="esExterno(anuncio)" class="etiqueta-externa">ENLACE EXTERNO</span>
        <span class="contenido">
          <strong>{{ anuncio.title }}</strong>
          <small *ngIf="anuncio.description">{{ anuncio.description }}</small>
          <small class="anunciante">Anunciante: {{ anuncio.advertiser }}</small>
        </span>
      </a>
    </li>
  </ol>
</aside>
