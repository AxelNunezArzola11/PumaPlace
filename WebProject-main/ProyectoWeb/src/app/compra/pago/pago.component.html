<section class="payment-page">
  <h1>Pago de la orden #{{ ordenId }}</h1>
  <p *ngIf="!error">{{ estado }}</p>
  <p class="hint">Paga con tu usuario de prueba comprador (no tu cuenta real de Mercado Pago), de preferencia en una ventana privada.</p>
  <button *ngIf="preferenciaFallida" type="button" (click)="solicitarPreferencia()">Reintentar pago</button>
  <p class="error" *ngIf="error">{{ error }}</p>
</section>
