<header class="navbar">
  <div class="container">
    <div class="logo">
        <a routerLink="/productos" aria-label="Puma Place">
          <img src="assets/images/PumaXpress.png" class="logo-img" alt="Puma Place">
        </a>
        <span class="brand-name">Puma Place</span>
    </div>
    
    <div class="nav-links">
      <a routerLink="/productos">Productos</a>
      <ng-container *ngIf="usuario">
        <a *ngIf="usuario.rol !== 'vendedor'" routerLink="/carrito">Carrito</a>
        <a *ngIf="usuario.rol === 'vendedor' || usuario.rol === 'dual'" routerLink="/mis-productos">Mis Productos</a>
        <button
          *ngIf="usuario.rol === 'comprador'"
          type="button"
          class="sell-button"
          [disabled]="convertingToSeller"
          (click)="convertirEnVendedor()">
          {{ convertingToSeller ? 'Activando...' : 'Quiero vender' }}
        </button>
        <a *ngIf="usuario" routerLink="/ordenes">Órdenes</a>
        <a *ngIf="usuario" routerLink="/notificaciones">Notificaciones</a>
      </ng-container>
    </div>
    
    <div class="user-area" *ngIf="usuario; else loginButton">
      <app-carrito-icon *ngIf="usuario.rol !== 'vendedor'" class="carrito-nav-icon"></app-carrito-icon>
      
      <div class="user-profile">
        <span class="user-name clickable" (click)="abrirModalPassword()" title="Actualizar contraseña">{{ usuario.correo }}</span>
        <span class="user-role">({{ usuario.rol }})</span>
      </div>
      <button class="logout-button" (click)="cerrarSesion()">
        <i class="icon-logout"></i> Cerrar sesión
      </button>
      <small class="seller-error" *ngIf="sellerError">{{ sellerError }}</small>
    </div>
    
    <ng-template #loginButton>
      <div class="auth-links">
        <a class="auth-link" routerLink="/login">Iniciar sesión</a>
        <a class="auth-link" routerLink="/registro">Registrarse</a>
      </div>
    </ng-template>
  </div>
  
  <section class="seller-form" *ngIf="sellerFormVisible">
    <h2>Datos para vender</h2>
    <p>Usaremos estos datos sólo para confirmar tu identidad y recibir pagos. Los datos de pago se cifran y no se muestran completos.</p>
    <form [formGroup]="sellerForm" (ngSubmit)="enviarSolicitudVendedor()">
      <input placeholder="Nombre completo" formControlName="nombreCompleto">
      <input placeholder="Teléfono" formControlName="telefono">
      <input placeholder="Número de cuenta UNAM" formControlName="numeroCuenta">
      <input placeholder="CLABE o correo de Mercado Pago" formControlName="datosPago">
      <label><input type="checkbox" formControlName="consentimientoDatos"> Acepto el tratamiento de mis datos personales.</label>
      <button type="submit" [disabled]="convertingToSeller">{{ convertingToSeller ? 'Guardando...' : 'Confirmar' }}</button>
      <button type="button" (click)="sellerFormVisible = false">Cancelar</button>
    </form>
  </section>

  <!-- Modal para cambiar contraseña -->
  <app-password-modal 
    [visible]="passwordModalVisible" 
    (close)="cerrarModalPassword()"
  ></app-password-modal>
</header>
